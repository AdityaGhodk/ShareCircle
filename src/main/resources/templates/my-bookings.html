
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings | ShareCircle</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body class="browse-page">

<header class="browse-navbar">

    <a class="browse-logo" th:href="@{/}">
        <span class="browse-logo-icon">S</span> ShareCircle
    </a>

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/browse}">Browse Items</a>
        <a th:href="@{/my-bookings}">My Bookings</a>
    </nav>

</header>

<main class="browse-content">

    <div class="browse-heading">
        <div>
            <h2>My Bookings</h2>
            <p>View your item rental bookings here.</p>
        </div>
    </div>

    <!-- No Bookings -->
    <div th:if="${bookingItems == null or bookingItems.isEmpty()}">

        <p>You have no bookings yet.</p>

        <a th:href="@{/browse}" class="view-item-btn">
            Browse Items
        </a>

    </div>

    <!-- Booking List -->
    <div th:if="${bookingItems != null and !bookingItems.isEmpty()}"
         class="booking-list">

        <div th:each="data : ${bookingItems}"
             class="booking-form-card">

            <!-- Left Side: Booking Details -->
            <div class="booking-details">

                <h3>
                    Booking ID:
                    <span th:text="${data.booking.id}"></span>
                </h3>

                <p>
                    Item ID:
                    <span th:text="${data.booking.itemId}"></span>
                </p>

                <p>
                    Start Date:
                    <span th:text="${data.booking.startDate}"></span>
                </p>

                <p>
                    End Date:
                    <span th:text="${data.booking.endDate}"></span>
                </p>

                <p>
                    Total Price: ₹<span
                        th:text="${data.booking.totalPrice}"></span>
                </p>

                <p>
                    Security Deposit: ₹<span
                        th:text="${data.booking.securityDeposit}"></span>
                </p>

                <p>
                    Status:
                    <strong th:text="${data.booking.status}"></strong>
                </p>

            </div>

            <!-- Right Side: Booked Item Image -->
            <div class="booking-item-image"
                 th:if="${data.item != null}">

                <img th:src="${data.item.imageUrl}"
                     th:alt="${data.item.name}"
                     onerror="this.style.display='none'">

                <h4 th:text="${data.item.name}"></h4>

            </div>

            <div th:if="${data.item == null}">
                <p>Item details not available.</p>
            </div>

        </div>

    </div>

</main>

<footer class="browse-footer">
    © 2026 ShareCircle. All rights reserved.
</footer>

</body>
</html>
