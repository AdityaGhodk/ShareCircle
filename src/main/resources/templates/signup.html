
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ShareCircle</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="auth-page">

<header class="auth-navbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-icon">S</span> ShareCircle
    </a>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/}">Browse Items</a>
        <a class="nav-button" th:href="@{/login}">Login</a>
    </nav>
</header>

<main class="auth-layout signup-layout">
    <aside class="auth-side">
        <div class="side-icon">🌿</div>
        <h3>Join Our<br>Sharing<br>Community</h3>
        <div class="side-line"></div>
        <p>Share items. Save money.</p>
    </aside>

    <section class="auth-card signup-card">
        <div class="auth-icon">♧</div>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join the ShareCircle community.</p>

        <form th:action="@{/signup}" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password"
                   minlength="6" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Confirm your password"
                   minlength="6" required>

            <button class="auth-submit" type="submit">
                Create Account
            </button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <p class="auth-switch">
            Already have an account?
            <a th:href="@{/login}">Login</a>
        </p>
    </section>

    <aside class="auth-side right-side">
        <div class="side-icon">♧</div>
        <h3>Share<br>Borrow<br>Make a Difference</h3>
        <div class="side-line"></div>
        <p>Welcome to ShareCircle!</p>
    </aside>
</main>

<footer class="auth-footer">
    © 2026 ShareCircle. All rights reserved.
</footer>

</body>
</html>
